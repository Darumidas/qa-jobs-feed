name: Generate QA Jobs Feed

on:
  schedule:
    - cron: '0 7,11,15,19 * * *'  # 4 veces al día: 09h, 13h, 17h, 21h hora España
  workflow_dispatch:        # permite ejecutar manualmente desde GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed.xml
        run: python generate_feed.py

      - name: Commit and push feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml feed_all.xml
          git diff --staged --quiet || git commit -m "chore: update feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
